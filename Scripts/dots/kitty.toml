[kitty]
    description = "A modern, hackable, featureful, OpenGL-based terminal emulator"

[[kitty.dependency]]
    pacman = [ "kitty" ] # Dependency for kitty

[[kitty.files]]
    action      = "sync"
    paths       = "kitty/hyde.conf"
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"

# kitty.conf is the user-facing entry point: it does nothing but `include
# hyde.conf` and then carries the user's own tweaks, several of which it ships
# commented out as an invitation to edit. Syncing it alongside hyde.conf meant
# an upgrade silently reverted those edits. HyDE keeps its managed settings in
# hyde.conf, so kitty.conf can stay user-owned like every other entry point
# (hyprland.lua, .zshrc, config.fish).
[[kitty.files]]
    action      = "preserve"
    paths       = [ "kitty/kitty.conf", "kitty/theme.conf" ]
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"
